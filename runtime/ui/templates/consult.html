{{template "head" .}}
<style>
  /* tints of the theme colours (Tailwind's /opacity modifiers cannot reach CSS-variable colours) */
  .t-heat { background: color-mix(in srgb, var(--heat) 13%, transparent); }
  .t-accent { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .t-good { background: color-mix(in srgb, var(--good) 13%, transparent); }
  .t-bad { background: color-mix(in srgb, var(--bad) 13%, transparent); }
  .r-heat { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--heat) 45%, transparent); }
  .r-accent { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
  [x-cloak] { display: none !important; }
</style>
<div x-data="consultPage()" x-init="init()" x-cloak class="space-y-6">

  <!-- page head: what this is, who is looking -->
  <div class="flex flex-wrap items-end gap-x-6 gap-y-3 pt-2">
    <div class="mr-auto min-w-0">
      <h1 class="text-2xl font-semibold tracking-tight">咨询档案</h1>
      <p class="mt-1 text-sm text-muted max-w-2xl">每个数字都来自服务器执行过的查询；计划只有在另一个人采纳后才会动现场，验收时重新量一次。</p>
    </div>
    <div class="relative flex items-center gap-2 text-sm" x-data="{open: false}">
      <template x-if="me.user">
        <span class="inline-flex items-center gap-2 rounded-full bg-panel ring-1 ring-line pl-1 pr-3 py-1">
          <span class="grid size-7 place-items-center rounded-full t-accent text-accent font-semibold" x-text="me.user.slice(0, 1)"></span>
          <b x-text="me.user"></b><span class="text-muted" x-text="roleText(me.role)"></span>
        </span>
      </template>
      <template x-if="!me.user"><span class="text-heat">还没登录</span></template>
      <button @click="open = !open" class="rounded-full px-3 py-1.5 ring-1 ring-line text-muted hover:text-txt">换人</button>
      <div x-show="open" @click.outside="open = false" class="absolute right-0 top-full mt-2 z-20 w-80 rounded-2xl bg-panel ring-1 ring-line p-4 shadow-2xl space-y-3">
        <div class="text-sm font-medium" x-text="auth === 'open' ? '开发模式：用名字登录' : '粘贴你的访问令牌'"></div>
        <input x-show="auth === 'open'" x-model="nameInput" placeholder="你的名字" class="w-full bg-ink ring-1 ring-line rounded-lg px-3 py-2 text-sm">
        <input x-show="auth !== 'open'" x-model="tokenInput" type="password" placeholder="令牌" class="w-full bg-ink ring-1 ring-line rounded-lg px-3 py-2 text-sm">
        <button @click="setIdentity(); open = false" class="w-full rounded-lg bg-accent text-ink font-semibold py-2 text-sm">登录</button>
      </div>
      <button @click="load()" title="刷新" class="grid size-8 place-items-center rounded-full ring-1 ring-line text-muted hover:text-txt">↻</button>
    </div>
  </div>

  {{if not .Enabled}}
  <div class="rounded-2xl ring-1 ring-line bg-panel p-5 text-sm text-heat">咨询闭环没有启用：默认数据库需要有语义模型（并且没有设置 consult.disabled）。</div>
  {{end}}
  <template x-if="error"><div class="rounded-2xl t-bad p-4 text-sm text-bad" x-text="error"></div></template>
  <template x-if="notice"><div class="rounded-2xl t-good p-4 text-sm text-good whitespace-pre-wrap" x-text="notice"></div></template>

  <template x-if="board && board.goals.length === 0">
    <div class="rounded-2xl bg-panel ring-1 ring-line p-8 text-center">
      <div class="text-lg font-medium">还没有咨询目标</div>
      <p class="mt-2 text-sm text-muted">到「顾问对话」里说一句你想改善什么，顾问会调查、写下有证据的结论，并提出计划。</p>
      <a href="/ui/copilot" class="mt-4 inline-block rounded-lg bg-accent text-ink font-semibold px-4 py-2 text-sm">去和顾问对话</a>
    </div>
  </template>

  <template x-for="gv in (board ? board.goals : [])" :key="gv.goal.id">
    <article class="card rounded-3xl bg-panel ring-1 ring-line overflow-hidden">

      <!-- the six stages: where this engagement stands -->
      <ol class="grid grid-cols-6 border-b border-line text-xs">
        <template x-for="(s, i) in stages(gv)" :key="s.name">
          <li class="relative px-2 sm:px-4 py-3 text-center sm:text-left" :class="s.now ? 't-heat' : ''">
            <div class="h-1 rounded-full mb-2" :style="'background:' + (s.done ? 'var(--heat)' : 'var(--line)')"></div>
            <span class="num mr-1" :class="s.done || s.now ? 'text-heat' : 'text-muted'" x-text="i + 1"></span>
            <span :class="s.now ? 'text-txt font-semibold' : (s.done ? 'text-txt' : 'text-muted')" x-text="s.name"></span>
            <div class="hidden sm:block text-[11px] text-muted mt-0.5 truncate" x-text="s.note"></div>
          </li>
        </template>
      </ol>

      <!-- goal: the number this is all about -->
      <header class="px-5 sm:px-8 pt-6 pb-7 grid gap-6 lg:grid-cols-[1fr_auto] lg:items-end">
        <div class="min-w-0">
          <div class="text-xs text-muted">
            <span x-text="'目标 ' + gv.goal.id"></span>
            <span x-show="gv.goal.author" x-text="' · ' + gv.goal.author + (gv.goal.via ? '（经顾问对话）' : '') + ' · ' + day(gv.goal.at)"></span>
          </div>
          <h2 class="mt-1 text-xl sm:text-2xl font-semibold leading-snug" x-text="gv.goal.what"></h2>
          <div class="mt-3 flex flex-wrap gap-2 text-xs">
            <template x-for="f in (gv.goal.scope || [])"><span class="rounded-full bg-ink ring-1 ring-line px-2.5 py-1" :title="f.dimension" x-text="scopeText(f)"></span></template>
            <template x-for="g in (gv.goal.guards || [])"><span class="rounded-full r-heat text-heat px-2.5 py-1" x-text="guardText(g)"></span></template>
          </div>
        </div>
        <div class="flex items-end gap-4 sm:gap-6" x-show="gv.goal.metric">
          <div>
            <div class="text-xs text-muted" x-text="label(gv.goal.metric) + ' · 基线'"></div>
            <div class="num text-4xl sm:text-5xl font-semibold leading-none mt-1" x-text="fmt(gv.goal.metric, gv.goal.baseline && gv.goal.baseline.value)"></div>
            <div class="text-[11px] text-muted mt-1.5" x-text="windowText(gv.goal.baseline)"></div>
          </div>
          <div class="pb-6 text-2xl text-muted">→</div>
          <div>
            <div class="text-xs text-heat" x-text="(gv.goal.direction === 'down' ? '降 ' : '升 ') + pct(gv.goal.by) + ' · ' + gv.goal.within_days + ' 天内'"></div>
            <div class="num text-4xl sm:text-5xl font-semibold leading-none mt-1 text-heat" x-text="fmt(gv.goal.metric, gv.target)"></div>
            <div class="text-[11px] text-muted mt-1.5">达标线</div>
          </div>
        </div>
      </header>

      <!-- findings: numbered because plans cite them by number -->
      <section class="px-5 sm:px-8 py-6 border-t border-line">
        <h3 class="text-sm font-semibold">结论 <span class="ml-1 font-normal text-muted" x-text="gv.findings.length ? gv.findings.length + ' 条，每条都绑着执行过的查询' : ''"></span></h3>
        <template x-if="gv.findings.length === 0"><p class="mt-3 text-sm text-muted">还没有结论。</p></template>
        <div class="mt-4 grid gap-3 md:grid-cols-2">
          <template x-for="f in gv.findings" :key="f.id">
            <div class="rounded-2xl bg-ink ring-1 ring-line p-4 flex flex-col" x-data="{open: -1}">
              <div class="flex gap-3">
                <span class="num shrink-0 grid size-7 place-items-center rounded-lg t-accent text-accent text-sm font-semibold" x-text="f.id"></span>
                <p class="text-sm leading-relaxed" x-text="f.says"></p>
              </div>
              <div class="mt-3 flex flex-wrap gap-1.5 pl-10">
                <template x-for="(e, i) in f.evidence">
                  <button @click="open = open === i ? -1 : i" class="rounded-full px-2.5 py-1 text-[11px] ring-1 ring-line hover:text-txt"
                    :class="open === i ? 'text-accent r-accent' : 'text-muted'" x-text="'证据 ' + (i + 1) + ' · ' + e.row_count + ' 行'"></button>
                </template>
              </div>
              <template x-for="(e, i) in f.evidence">
                <div x-show="open === i" class="mt-3 pl-10 space-y-2">
                  <div class="text-xs text-muted" x-text="e.asked"></div>
                  <div class="overflow-x-auto rounded-lg ring-1 ring-line" x-show="e.rows && e.rows.length">
                    <table class="w-full text-xs">
                      <thead class="bg-panel"><tr><template x-for="c in e.columns"><th class="text-left font-medium text-muted px-2.5 py-1.5 whitespace-nowrap" x-text="label(c)"></th></template></tr></thead>
                      <tbody><template x-for="row in e.rows.slice(0, 12)"><tr class="border-t border-line"><template x-for="(cell, ci) in row"><td class="px-2.5 py-1.5 whitespace-nowrap" :class="typeof cell === 'number' ? 'num text-right' : ''" x-text="cellText(e.columns[ci], cell)"></td></template></tr></template></tbody>
                    </table>
                  </div>
                  <div class="text-[11px] text-muted" x-show="e.row_count > 12" x-text="'只显示前 12 行，共 ' + e.row_count + ' 行'"></div>
                  <details><summary class="cursor-pointer text-[11px] text-muted hover:text-accent">查看 SQL</summary><pre class="mt-1 text-[11px] bg-panel ring-1 ring-line rounded-lg p-2.5 overflow-x-auto" x-text="e.sql"></pre></details>
                </div>
              </template>
            </div>
          </template>
        </div>
      </section>

      <!-- plans: proposal → adoption → actions → acceptance -->
      <section class="px-5 sm:px-8 py-6 border-t border-line space-y-4">
        <h3 class="text-sm font-semibold">计划</h3>
        <template x-if="gv.plans.length === 0"><p class="text-sm text-muted">还没有计划。</p></template>
        <template x-for="pv in gv.plans" :key="pv.plan.id">
          <div class="rounded-2xl bg-ink ring-1 ring-line overflow-hidden" x-data="{why: '', asOf: ''}">
            <div class="p-5 grid gap-5 lg:grid-cols-[1fr_17rem]">
              <div class="min-w-0">
                <div class="flex flex-wrap items-center gap-2">
                  <span class="num text-xs text-muted" x-text="'计划 ' + pv.plan.id"></span>
                  <span class="rounded-full px-2.5 py-0.5 text-xs font-medium" :class="stateClass(pv)" x-text="stateText(pv)"></span>
                </div>
                <p class="mt-2 text-base font-medium leading-relaxed" x-text="pv.plan.does"></p>
                <div class="mt-3 flex flex-wrap gap-2 text-xs">
                  <span class="rounded-full t-accent text-accent px-2.5 py-1" x-text="'预期 ' + label(pv.plan.expect.metric) + (pv.plan.expect.direction === 'down' ? '降 ' : '升 ') + pct(pv.plan.expect.by) + '，' + pv.plan.expect.within_days + ' 天后验收'"></span>
                  <template x-for="g in (pv.plan.guards || [])"><span class="rounded-full r-heat text-heat px-2.5 py-1" x-text="guardText(g)"></span></template>
                  <span class="rounded-full ring-1 ring-line text-muted px-2.5 py-1" x-text="'依据 ' + pv.plan.findings.join('、')"></span>
                </div>
                <p class="mt-3 text-xs text-muted leading-relaxed" x-show="pv.plan.cost" x-text="'代价：' + pv.plan.cost"></p>
                <p class="mt-1 text-xs text-heat" x-show="pv.plan.note" x-text="pv.plan.note"></p>

                <!-- what it will do on site -->
                <template x-if="(pv.plan.actions || []).length">
                  <div class="mt-4">
                    <div class="text-xs text-muted mb-2" x-text="pv.decision ? '下发到现场的动作' : '采纳后会下发到现场'"></div>
                    <ol class="space-y-2">
                      <template x-for="(a, i) in pv.plan.actions">
                        <li class="flex gap-3 text-sm">
                          <span class="num shrink-0 grid size-6 place-items-center rounded-full text-[11px]"
                            :class="runOf(pv, i) ? (runOf(pv, i).error ? 't-bad text-bad' : 't-good text-good') : 'ring-1 ring-line text-muted'"
                            x-text="runOf(pv, i) ? (runOf(pv, i).error ? '!' : '✓') : (i + 1)"></span>
                          <div class="min-w-0">
                            <div x-text="a.why || (a.tool + ' ' + JSON.stringify(a.args || {}))"></div>
                            <div class="mt-1 flex flex-wrap gap-1 text-[11px] text-muted">
                              <span class="rounded bg-panel ring-1 ring-line px-1.5 py-0.5" x-text="a.server + ' · ' + a.tool"></span>
                              <template x-for="kv in Object.entries(a.args || {})"><span class="rounded bg-panel ring-1 ring-line px-1.5 py-0.5" x-text="kv[0] + ' ' + kv[1]"></span></template>
                            </div>
                            <div class="mt-1 text-[11px]" x-show="runOf(pv, i)" :class="runOf(pv, i) && runOf(pv, i).error ? 'text-bad' : 'text-good'" x-text="runText(runOf(pv, i))"></div>
                          </div>
                        </li>
                      </template>
                    </ol>
                  </div>
                </template>
              </div>

              <!-- the record: who proposed, who decided, when it is judged -->
              <ol class="relative space-y-4 text-sm lg:border-l lg:border-line lg:pl-5">
                <li>
                  <div class="text-xs text-muted">提出</div>
                  <div x-text="pv.plan.by + (pv.plan.via ? '（经顾问对话）' : '') + ' · ' + day(pv.plan.at)"></div>
                </li>
                <li>
                  <div class="text-xs text-muted">采纳</div>
                  <template x-if="pv.decision">
                    <div>
                      <div><b x-text="pv.decision.who"></b> <span x-text="(pv.decision.verdict === 'adopted' ? '采纳' : '否决') + ' · ' + day(pv.decision.at)"></span></div>
                      <p class="mt-1 text-xs text-muted leading-relaxed" x-show="pv.decision.why" x-text="'「' + pv.decision.why + '」'"></p>
                      <template x-if="pv.decision.baseline">
                        <div class="mt-2 text-xs">
                          <span class="text-muted">钉住的基线 </span><b class="num" x-text="fmt(pv.decision.baseline.metric, pv.decision.baseline.value)"></b>
                          <template x-for="g in (pv.decision.guard_baselines || [])"><div class="text-muted" x-text="label(g.metric) + ' ' + fmt(g.metric, g.value)"></div></template>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!pv.decision"><div class="text-muted">等另一个人决定</div></template>
                </li>
                <li>
                  <div class="text-xs text-muted">验收</div>
                  <template x-if="pv.acceptance">
                    <div>
                      <span class="rounded-full px-2.5 py-0.5 text-xs font-semibold" :class="outcomeClass(pv.acceptance.outcome)" x-text="outcomeText(pv.acceptance.outcome)"></span>
                      <p class="mt-1 text-xs leading-relaxed" x-text="pv.acceptance.says"></p>
                      <template x-for="g in (pv.acceptance.guards || [])">
                        <div class="text-xs" :class="g.broken ? 'text-bad' : 'text-muted'" x-text="label(g.guard.metric) + (g.broken ? ' 破了' : ' 守住') + '：' + fmt(g.guard.metric, g.baseline) + ' → ' + fmt(g.guard.metric, g.measured && g.measured.value)"></div>
                      </template>
                    </div>
                  </template>
                  <template x-if="!pv.acceptance && pv.due">
                    <div>
                      <div><span class="num text-2xl font-semibold" x-text="daysLeft(pv.due)"></span> <span class="text-muted text-xs" x-text="'天后 · ' + pv.due"></span></div>
                      <p class="mt-1 text-xs text-muted" x-show="pv.progress" x-text="pv.progress && ('进度：' + pv.progress.says)"></p>
                    </div>
                  </template>
                  <template x-if="!pv.acceptance && !pv.due"><div class="text-muted">采纳后开始计时</div></template>
                </li>
              </ol>
            </div>

            <!-- decisions are made here, by a person -->
            <div class="border-t border-line px-5 py-3 flex flex-wrap items-center gap-2" x-show="pv.state === 'proposed' || pv.state === 'adopted'">
              <template x-if="pv.state === 'proposed'">
                <div class="flex flex-wrap items-center gap-2 w-full">
                  <input x-model="why" placeholder="写一句理由（否决时必填）" class="bg-panel ring-1 ring-line rounded-lg px-3 py-2 text-sm flex-1 min-w-48">
                  <input x-show="false" x-model="asOf">
                  <button @click="act(pv.plan.id, 'adopt', {why: why, as_of: asOf})" class="rounded-lg bg-accent text-ink font-semibold px-4 py-2 text-sm">采纳并下发</button>
                  <button @click="act(pv.plan.id, 'reject', {why: why})" class="rounded-lg ring-1 ring-line text-bad px-4 py-2 text-sm">否决</button>
                </div>
              </template>
              <template x-if="pv.state === 'adopted'">
                <div class="flex flex-wrap items-center gap-2">
                  <button @click="act(pv.plan.id, 'measure', {})" class="rounded-lg ring-1 ring-line px-4 py-2 text-sm hover:text-accent">量一下进度</button>
                  <button @click="act(pv.plan.id, 'accept', {})" class="rounded-lg ring-1 ring-line px-4 py-2 text-sm text-muted hover:text-txt" title="窗口未到时验收，结论按已有数据给出">提前验收</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </section>
    </article>
  </template>
</div>

<script>
function consultPage(){
  return {
    board: null, me: {}, auth: '{{.AuthMode}}', error: '', notice: '', tokenInput: '', nameInput: '', meta: {},
    async init(){ await this.whoami(); await Promise.all([this.loadMeta(), this.load()]); },
    async whoami(){
      try { const r = await fetch('/v1/whoami'); const j = await r.json();
        this.me = r.ok ? j : {error: j.error}; if (j.auth) this.auth = j.auth; } catch(e){ this.me = {error: String(e)}; }
    },
    // metric names in the model's own words: the first synonym written in Chinese, if any
    async loadMeta(){
      try { const r = await fetch('/v1/metrics'); if (!r.ok) return; const j = await r.json();
        const m = {}; for (const x of (j.metrics || [])) m[x.name] = x; this.meta = m; } catch(e){}
    },
    async load(){
      this.error = '';
      try { const r = await fetch('/v1/consult'); const j = await r.json();
        if (!r.ok) { this.error = j.error || ('HTTP ' + r.status); return; }
        if ((j.loose_findings || []).length || (j.loose_plans || []).length) {
          j.goals.push({goal: {id: '—', what: '没有归到目标下的结论与计划', scope: [], guards: []}, findings: j.loose_findings || [], plans: j.loose_plans || []});
        }
        this.board = j; } catch(e){ this.error = String(e); }
    },
    async act(id, verb, body){
      this.error = ''; this.notice = '';
      const clean = {}; for (const k in body) if (body[k]) clean[k] = body[k];
      const r = await fetch('/v1/consult/plans/' + id + '/' + verb, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(clean)});
      const j = await r.json();
      if (!r.ok) { this.error = j.error || ('HTTP ' + r.status); return; }
      if (verb === 'adopt') {
        const runs = j.actions || [];
        this.notice = '已采纳计划 ' + id + '，基线 ' + this.fmt(j.decision.baseline.metric, j.decision.baseline.value) + ' 已钉住。' + (runs.length ? ' 下发了 ' + runs.length + ' 个动作，' + runs.filter(a => !a.error).length + ' 个成功。' : '');
      } else if (j.says) { this.notice = j.says; }
      await this.load();
    },
    setIdentity(){
      const opts = '; path=/; SameSite=Strict';
      if (this.auth === 'open') document.cookie = 'di_user=' + encodeURIComponent(this.nameInput.trim()) + opts;
      else document.cookie = 'di_token=' + encodeURIComponent(this.tokenInput.trim()) + opts;
      this.tokenInput = ''; this.whoami().then(() => this.load());
    },
    stages(gv){
      const plans = gv.plans || [];
      const ev = (gv.findings || []).reduce((n, f) => n + (f.evidence || []).length, 0);
      const adopted = plans.filter(p => p.decision && p.decision.verdict === 'adopted');
      const accepted = plans.filter(p => p.acceptance);
      const s = [
        {name: '目标', done: !!gv.goal.metric, note: gv.goal.metric ? this.label(gv.goal.metric) : ''},
        {name: '调查', done: ev > 0, note: ev ? ev + ' 次查询' : ''},
        {name: '结论', done: (gv.findings || []).length > 0, note: (gv.findings || []).length ? gv.findings.length + ' 条' : ''},
        {name: '计划', done: plans.length > 0, note: plans.length ? plans.length + ' 个' : ''},
        {name: '实施', done: adopted.length > 0, note: adopted.length ? '已采纳 ' + adopted.length : ''},
        {name: '验收', done: accepted.length > 0, note: accepted.length ? this.outcomeText(accepted[0].acceptance.outcome) : (adopted[0] && adopted[0].due ? adopted[0].due + ' 到期' : '')},
      ];
      const i = s.findIndex(x => !x.done);
      if (i >= 0) s[i].now = true;
      return s;
    },
    label(name){
      const m = this.meta[name];
      const zh = m && (m.synonyms || []).find(x => /[一-鿿]/.test(x));
      return zh || name;
    },
    // a share (rate, yield, availability …) reads as a percentage
    isShare(name){
      const m = this.meta[name];
      return /(rate|yield|ratio|share|availability|performance|oee|_pct)$/i.test(name || '') || (m && m.additivity === 'non_additive' && /率/.test(this.label(name)));
    },
    fmt(name, v){
      if (v === null || v === undefined) return '无数据';
      const x = Number(v);
      if (this.isShare(name) && Math.abs(x) <= 1.5) { const d = Math.abs(x) < 0.1 ? 2 : 1; return (x * 100).toLocaleString('zh-CN', {minimumFractionDigits: d, maximumFractionDigits: d}) + '%'; }
      return this.num(x);
    },
    num(v){ if (v === null || v === undefined) return '无数据'; const x = Number(v); return Math.abs(x) < 1 && x !== 0 ? x.toLocaleString('zh-CN', {maximumSignificantDigits: 4}) : x.toLocaleString('zh-CN', {maximumFractionDigits: 2}); },
    cellText(col, v){ if (typeof v !== 'number') return v === null || v === undefined ? '—' : String(v).replace(/T00:00:00Z?$/, ''); return this.fmt(col, v); },
    pct(v){ return Math.round(v * 1000) / 10 + '%'; },
    day(t){ return t ? String(t).slice(0, 10) : ''; },
    daysLeft(d){ return Math.max(0, Math.ceil((new Date(d + 'T00:00:00') - new Date()) / 86400000)); },
    windowText(m){ return m ? m.from + ' 至 ' + m.to + (m.data_days ? '，' + m.data_days + ' 天有数据' : '') : ''; },
    scopeText(f){ if (f.and || f.or) return JSON.stringify(f); const v = (f.values || []).join('、'); return f.op === '=' || f.op === 'in' ? v : f.dimension + ' ' + f.op + ' ' + v; },
    guardText(g){ return '护栏：' + this.label(g.metric) + (g.worse_is === 'up' ? '升' : '降') + (g.tolerance != null ? '不超过 ' + this.pct(g.tolerance) : '') + (g.limit != null ? '（界限 ' + this.fmt(g.metric, g.limit) + '）' : ''); },
    roleText(r){ return {approver: '审批人', analyst: '分析师', admin: '管理员'}[r] || r || ''; },
    runOf(pv, i){ return (pv.actions || [])[i]; },
    runText(r){ if (!r) return ''; if (r.skipped) return '未执行'; if (r.error) return '失败：' + r.error; let t = r.result || ''; try { const j = JSON.parse(t); t = j.sent || j.msg || t; } catch(e){} return '已执行 · ' + t; },
    stateText(pv){ return {proposed: '待采纳', adopted: '实施中', rejected: '已否决', accepted: '已验收'}[pv.state] || pv.state; },
    stateClass(pv){ return {proposed: 't-heat text-heat', adopted: 't-accent text-accent', rejected: 'bg-line text-muted', accepted: 't-good text-good'}[pv.state]; },
    outcomeText(o){ return {achieved: '达成', missed: '没做到', guard_broken: '护栏破了', no_data: '没有数据'}[o] || o; },
    outcomeClass(o){ return {achieved: 't-good text-good', missed: 't-bad text-bad', guard_broken: 't-heat text-heat', no_data: 'bg-line text-muted'}[o]; },
  };
}
</script>
