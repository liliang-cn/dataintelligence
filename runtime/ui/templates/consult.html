{{template "head" .}}
<div x-data="consultPage()" x-init="init()" class="space-y-4">
  <div class="flex flex-wrap items-end gap-3">
    <div class="mr-auto">
      <h1 class="text-lg font-semibold">咨询闭环</h1>
      <p class="text-sm text-muted">目标 → 调查 → 结论 → 计划 → 实施 → 验收。每个数字都是服务器执行语义查询得来的；采纳与验收只能由人在这里完成。</p>
    </div>
    <button @click="load()" class="text-xs px-3 py-1.5 rounded-lg ring-1 ring-line text-muted hover:text-accent">刷新</button>
  </div>

  <!-- identity -->
  <div class="card bg-panel rounded-2xl ring-1 ring-line p-4 flex flex-wrap items-center gap-3 text-sm">
    <span class="text-muted">当前身份</span>
    <template x-if="me.user"><span><b x-text="me.user"></b> <span class="text-muted" x-text="'（' + me.role + '）'"></span></span></template>
    <template x-if="!me.user"><span class="text-amber-400" x-text="me.error || '未识别'"></span></template>
    <span class="text-xs px-2 py-0.5 rounded-full bg-line text-muted" x-text="'认证：' + authLabel()"></span>
    <div class="ml-auto flex items-center gap-2">
      <template x-if="auth === 'open'">
        <input x-model="nameInput" placeholder="开发模式：输入你的名字" class="bg-ink ring-1 ring-line rounded-lg px-2 py-1 text-sm w-44">
      </template>
      <template x-if="auth !== 'open'">
        <input x-model="tokenInput" type="password" placeholder="粘贴你的访问令牌" class="bg-ink ring-1 ring-line rounded-lg px-2 py-1 text-sm w-56">
      </template>
      <button @click="setIdentity()" class="text-xs px-3 py-1.5 rounded-lg bg-accent text-ink font-semibold">切换身份</button>
    </div>
  </div>

  {{if not .Enabled}}
  <div class="card bg-amber-950/30 ring-1 ring-amber-900/60 rounded-2xl p-5 text-amber-200 text-sm">
    咨询闭环没有启用：默认数据库需要有语义模型（并且没有设置 <code>consult.disabled</code>）。
  </div>
  {{end}}

  <template x-if="error">
    <div class="card bg-rose-950/40 ring-1 ring-rose-800 rounded-2xl p-4 text-rose-300 text-sm" x-text="error"></div>
  </template>
  <template x-if="notice">
    <div class="card bg-emerald-950/30 ring-1 ring-emerald-800 rounded-2xl p-4 text-emerald-300 text-sm whitespace-pre-wrap" x-text="notice"></div>
  </template>

  <template x-if="board && board.goals.length === 0">
    <div class="card bg-panel rounded-2xl ring-1 ring-line p-5 text-sm text-muted">
      还没有目标。到 <a href="/ui/copilot" class="text-accent">copilot</a> 里说一句你想达成什么，它会记下目标、调查、写下有证据的结论，并提出计划；或者调用 <code>POST /v1/consult/goals</code>。
    </div>
  </template>

  <template x-for="gv in (board ? board.goals : [])" :key="gv.goal.id">
    <section class="card bg-panel rounded-2xl ring-1 ring-line overflow-hidden">
      <!-- goal -->
      <div class="px-4 sm:px-5 py-4 border-b border-line space-y-2">
        <div class="flex flex-wrap items-center gap-2">
          <span class="text-xs font-mono px-2 py-0.5 rounded bg-line text-muted" x-text="gv.goal.id"></span>
          <h2 class="font-semibold" x-text="gv.goal.what"></h2>
          <span class="text-xs text-muted" x-show="gv.goal.author" x-text="'由 ' + gv.goal.author + (gv.goal.via ? '（经 ' + gv.goal.via + '）' : '') + ' 记于 ' + day(gv.goal.at)"></span>
        </div>
        <div class="flex flex-wrap gap-2 text-xs">
          <span x-show="gv.goal.metric" class="px-2 py-0.5 rounded-full ring-1 ring-accent/30 text-accent" x-text="gv.goal.metric + ' ' + dir(gv.goal.direction) + pct(gv.goal.by) + '，' + gv.goal.within_days + ' 天内'"></span>
          <template x-for="f in (gv.goal.scope || [])"><span class="px-2 py-0.5 rounded-full bg-line" x-text="filterText(f)"></span></template>
          <template x-for="g in (gv.goal.guards || [])"><span class="px-2 py-0.5 rounded-full ring-1 ring-amber-700/50 text-amber-400" x-text="'护栏 ' + guardText(g)"></span></template>
        </div>
        <div class="text-sm" x-show="gv.goal.baseline">
          基线 <b x-text="num(gv.goal.baseline && gv.goal.baseline.value)"></b>
          <span class="text-muted text-xs" x-text="windowText(gv.goal.baseline)"></span>
          → 达标线 <b x-text="num(gv.target)"></b>
        </div>
      </div>

      <!-- findings -->
      <div class="px-4 sm:px-5 py-3 border-b border-line space-y-2">
        <div class="text-xs uppercase tracking-wide text-muted">结论（每条都绑着服务器执行过的查询）</div>
        <template x-if="gv.findings.length === 0"><div class="text-sm text-muted">还没有结论。</div></template>
        <template x-for="f in gv.findings" :key="f.id">
          <div class="text-sm">
            <div><span class="font-mono text-xs text-muted" x-text="f.id"></span> <span x-text="f.says"></span>
              <span class="text-xs text-muted" x-text="'— ' + f.by + (f.via ? '（经 ' + f.via + '）' : '')"></span></div>
            <template x-for="(e, i) in f.evidence">
              <details class="ml-4 mt-1">
                <summary class="cursor-pointer text-xs text-muted hover:text-accent" x-text="'证据 ' + (i+1) + '：' + e.asked + ' · ' + e.row_count + ' 行' + (e.value != null ? ' · 值 ' + num(e.value) : '') + ' · ' + day(e.at)"></summary>
                <pre class="mt-1 text-[11px] bg-ink ring-1 ring-line rounded-lg p-2 overflow-x-auto" x-text="e.sql"></pre>
                <div class="overflow-x-auto mt-1" x-show="e.rows && e.rows.length">
                  <table class="text-[11px]">
                    <thead><tr><template x-for="c in e.columns"><th class="text-left pr-3 text-muted" x-text="c"></th></template></tr></thead>
                    <tbody><template x-for="row in e.rows.slice(0, 20)"><tr><template x-for="cell in row"><td class="pr-3" x-text="cell"></td></template></tr></template></tbody>
                  </table>
                  <div class="text-[11px] text-muted" x-show="e.rows.length > 20 || e.truncated" x-text="'（只显示前 20 行，共 ' + e.row_count + ' 行）'"></div>
                </div>
              </details>
            </template>
          </div>
        </template>
      </div>

      <!-- plans -->
      <div class="px-4 sm:px-5 py-3 space-y-3">
        <div class="text-xs uppercase tracking-wide text-muted">计划</div>
        <template x-if="gv.plans.length === 0"><div class="text-sm text-muted">还没有计划。</div></template>
        <template x-for="pv in gv.plans" :key="pv.plan.id">
          <div class="rounded-xl ring-1 ring-line p-3 space-y-2" x-data="{why: '', asOf: ''}">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-mono text-xs px-2 py-0.5 rounded bg-line text-muted" x-text="pv.plan.id"></span>
              <span class="text-xs px-2 py-0.5 rounded-full" :class="stateClass(pv)" x-text="stateText(pv)"></span>
              <span class="font-medium text-sm" x-text="pv.plan.does"></span>
            </div>
            <div class="text-xs text-muted" x-text="'提出：' + pv.plan.by + (pv.plan.via ? '（经 ' + pv.plan.via + '）' : '') + ' · ' + day(pv.plan.at) + ' · 依据结论 ' + pv.plan.findings.join('、') + (pv.plan.cost ? ' · 成本：' + pv.plan.cost : '')"></div>
            <div class="flex flex-wrap gap-2 text-xs">
              <span class="px-2 py-0.5 rounded-full ring-1 ring-accent/30 text-accent" x-text="'预期 ' + pv.plan.expect.metric + ' ' + dir(pv.plan.expect.direction) + pct(pv.plan.expect.by) + '，窗口 ' + pv.plan.expect.within_days + ' 天'"></span>
              <template x-for="f in (pv.plan.expect.scope || [])"><span class="px-2 py-0.5 rounded-full bg-line" x-text="filterText(f)"></span></template>
              <template x-for="g in (pv.plan.guards || [])"><span class="px-2 py-0.5 rounded-full ring-1 ring-amber-700/50 text-amber-400" x-text="'护栏 ' + guardText(g)"></span></template>
            </div>
            <div class="text-xs text-amber-400" x-show="pv.plan.note" x-text="pv.plan.note"></div>
            <template x-if="(pv.plan.actions || []).length">
              <div class="text-xs">
                <div class="text-muted">采纳后要执行的动作：</div>
                <template x-for="a in pv.plan.actions"><div class="ml-3 font-mono" x-text="a.server + '/' + a.tool + ' ' + JSON.stringify(a.args || {}) + (a.why ? ' — ' + a.why : '')"></div></template>
              </div>
            </template>

            <!-- decision -->
            <template x-if="pv.decision">
              <div class="text-sm border-t border-line pt-2">
                <span x-text="(pv.decision.verdict === 'adopted' ? '已采纳' : '已否决') + '：' + pv.decision.who + ' · ' + day(pv.decision.at) + (pv.decision.why ? ' · ' + pv.decision.why : '')"></span>
                <span class="text-xs text-amber-400" x-show="pv.decision.as_of_forced" x-text="'（窗口锚定日由操作者指定为 ' + pv.decision.as_of + '）'"></span>
                <template x-if="pv.decision.baseline">
                  <div>基线（采纳时量、已钉住） <b x-text="num(pv.decision.baseline.value)"></b>
                    <span class="text-xs text-muted" x-text="windowText(pv.decision.baseline)"></span>
                    <span x-show="pv.due" class="text-xs text-muted" x-text="' · 到期 ' + pv.due"></span>
                    <details class="inline-block"><summary class="cursor-pointer text-xs text-muted hover:text-accent">SQL</summary><pre class="text-[11px] bg-ink ring-1 ring-line rounded-lg p-2 overflow-x-auto" x-text="pv.decision.baseline.sql"></pre></details>
                  </div>
                </template>
                <template x-for="g in (pv.decision.guard_baselines || [])">
                  <div class="text-xs text-muted" x-text="'护栏基线 ' + g.metric + ' = ' + num(g.value)"></div>
                </template>
              </div>
            </template>

            <!-- action runs -->
            <template x-if="(pv.actions || []).length">
              <div class="text-xs border-t border-line pt-2 space-y-1">
                <div class="text-muted">已执行的动作：</div>
                <template x-for="r in pv.actions">
                  <details>
                    <summary class="cursor-pointer" :class="r.error ? 'text-rose-400' : 'text-emerald-400'"
                      x-text="'#' + r.index + ' ' + r.server + '/' + r.tool + ' · ' + (r.skipped ? '未执行' : (r.error ? '失败' : '成功')) + ' · ' + r.ms + 'ms'"></summary>
                    <pre class="text-[11px] bg-ink ring-1 ring-line rounded-lg p-2 overflow-x-auto" x-text="'参数 ' + JSON.stringify(r.args || {}, null, 2) + '\n' + (r.error ? '错误 ' + r.error + '\n' : '') + (r.result ? '结果 ' + r.result : '')"></pre>
                  </details>
                </template>
              </div>
            </template>

            <!-- progress / acceptance -->
            <template x-if="pv.progress && !pv.acceptance">
              <div class="text-sm border-t border-line pt-2">
                <span class="text-xs px-2 py-0.5 rounded-full bg-line text-muted">进度（不是结论）</span>
                <span x-text="pv.progress.says"></span>
                <span class="text-xs text-muted" x-text="'· 量于 ' + day(pv.progress.at)"></span>
              </div>
            </template>
            <template x-if="pv.acceptance">
              <div class="text-sm border-t border-line pt-2 space-y-1">
                <span class="text-xs px-2 py-0.5 rounded-full font-semibold" :class="outcomeClass(pv.acceptance.outcome)" x-text="outcomeText(pv.acceptance.outcome)"></span>
                <span x-text="pv.acceptance.says"></span>
                <div class="text-xs text-muted" x-text="'验收于 ' + day(pv.acceptance.at) + '，触发者 ' + (pv.acceptance.by || 'system') + ' · ' + windowText(pv.acceptance.measured)"></div>
                <template x-for="g in (pv.acceptance.guards || [])">
                  <div class="text-xs" :class="g.broken ? 'text-rose-400' : 'text-muted'" x-text="'护栏 ' + g.guard.metric + '：' + (g.broken ? '破了 · ' + g.why : '守住') + '（' + num(g.baseline) + ' → ' + num(g.measured && g.measured.value) + '）'"></div>
                </template>
              </div>
            </template>

            <!-- buttons -->
            <div class="flex flex-wrap items-center gap-2 pt-1">
              <template x-if="pv.state === 'proposed'">
                <div class="flex flex-wrap items-center gap-2 w-full">
                  <input x-model="why" placeholder="理由（否决时必填）" class="bg-ink ring-1 ring-line rounded-lg px-2 py-1 text-sm flex-1 min-w-40">
                  <input x-model="asOf" placeholder="锚定日 YYYY-MM-DD（仅回放）" class="bg-ink ring-1 ring-line rounded-lg px-2 py-1 text-xs w-48">
                  <button @click="act(pv.plan.id, 'adopt', {why: why, as_of: asOf})" class="text-xs px-3 py-1.5 rounded-lg bg-accent text-ink font-semibold">采纳</button>
                  <button @click="act(pv.plan.id, 'reject', {why: why})" class="text-xs px-3 py-1.5 rounded-lg ring-1 ring-rose-700 text-rose-400">否决</button>
                </div>
              </template>
              <template x-if="pv.state === 'adopted'">
                <div class="flex flex-wrap gap-2">
                  <button @click="act(pv.plan.id, 'measure', {})" class="text-xs px-3 py-1.5 rounded-lg ring-1 ring-line hover:text-accent">测一下进度</button>
                  <button @click="act(pv.plan.id, 'accept', {})" class="text-xs px-3 py-1.5 rounded-lg bg-accent text-ink font-semibold">验收</button>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
    </section>
  </template>
</div>

<script>
function consultPage(){
  return {
    board: null, me: {}, auth: '{{.AuthMode}}', error: '', notice: '', tokenInput: '', nameInput: '',
    async init(){ await this.whoami(); await this.load(); },
    async whoami(){
      try { const r = await fetch('/v1/whoami'); const j = await r.json();
        this.me = r.ok ? j : {error: j.error}; if (j.auth) this.auth = j.auth; } catch(e){ this.me = {error: String(e)}; }
    },
    async load(){
      this.error = '';
      try { const r = await fetch('/v1/consult'); const j = await r.json();
        if (!r.ok) { this.error = j.error || ('HTTP ' + r.status); return; }
        if ((j.loose_findings || []).length || (j.loose_plans || []).length) {
          j.goals.push({goal: {id: '—', what: '未关联目标的结论与计划', scope: [], guards: []}, findings: j.loose_findings || [], plans: j.loose_plans || []});
        }
        this.board = j; } catch(e){ this.error = String(e); }
    },
    async act(id, verb, body){
      this.error = ''; this.notice = '';
      const clean = {}; for (const k in body) if (body[k]) clean[k] = body[k];
      const r = await fetch('/v1/consult/plans/' + id + '/' + verb, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(clean)});
      const j = await r.json();
      if (!r.ok) { this.error = (j.rule ? '[' + j.rule + '] ' : '') + (j.error || ('HTTP ' + r.status)); return; }
      if (verb === 'adopt') {
        const runs = j.actions || [];
        this.notice = '已采纳 ' + id + '。基线 ' + this.num(j.decision.baseline.value) + ' 已钉住。' + (runs.length ? '\n执行了 ' + runs.length + ' 个动作：' + runs.map(a => a.tool + (a.error ? '（失败）' : '（成功）')).join('、') : '');
      } else if (j.says) { this.notice = j.says; }
      await this.load();
    },
    setIdentity(){
      const opts = '; path=/; SameSite=Strict';
      if (this.auth === 'open') document.cookie = 'di_user=' + encodeURIComponent(this.nameInput.trim()) + opts;
      else document.cookie = 'di_token=' + encodeURIComponent(this.tokenInput.trim()) + opts;
      this.tokenInput = ''; this.whoami().then(() => this.load());
    },
    authLabel(){ return {users: '令牌', oidc: 'OIDC', 'users+oidc': '令牌 / OIDC', open: '开发模式（无认证）'}[this.auth] || this.auth; },
    // small values (rates, shares) keep four significant digits: 0.01339 must not read as 0.01
    num(v){ if (v === null || v === undefined) return '无数据'; const x = Number(v); return Math.abs(x) < 1 && x !== 0 ? x.toLocaleString('zh-CN', {maximumSignificantDigits: 4}) : x.toLocaleString('zh-CN', {maximumFractionDigits: 2}); },
    pct(v){ return ' ' + Math.round(v * 1000) / 10 + '%'; },
    dir(d){ return d === 'down' ? '下降' : '上升'; },
    day(t){ return t ? String(t).slice(0, 10) : ''; },
    windowText(m){ return m ? '（' + m.metric + '，' + m.from + ' ~ ' + m.to + '，' + (m.data_days || 0) + ' 天有数据）' : ''; },
    filterText(f){ if (f.and || f.or) return JSON.stringify(f); return f.dimension + ' ' + f.op + ' ' + (f.values || []).join(', '); },
    guardText(g){ return g.metric + (g.worse_is === 'up' ? ' 不许升' : ' 不许降') + (g.tolerance != null ? '超过 ' + Math.round(g.tolerance * 1000) / 10 + '%' : '') + (g.limit != null ? '（界限 ' + this.num(g.limit) + '）' : ''); },
    stateText(pv){ return {proposed: '待采纳', adopted: '已采纳 · 实施中', rejected: '已否决', accepted: '已验收'}[pv.state] || pv.state; },
    stateClass(pv){ return {proposed: 'bg-amber-500/15 text-amber-400', adopted: 'bg-accent/15 text-accent', rejected: 'bg-line text-muted', accepted: 'bg-emerald-500/15 text-emerald-400'}[pv.state]; },
    outcomeText(o){ return {achieved: '达成', missed: '没做到', guard_broken: '护栏破了', no_data: '没有数据'}[o] || o; },
    outcomeClass(o){ return {achieved: 'bg-emerald-500/20 text-emerald-400', missed: 'bg-rose-500/20 text-rose-400', guard_broken: 'bg-amber-500/20 text-amber-400', no_data: 'bg-line text-muted'}[o]; },
  };
}
</script>
{{template "foot" .}}
