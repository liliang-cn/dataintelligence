# SmartFactory × DataIntelligence — the consulting half.
#
# SmartFactory (the 3D twin) is the monitoring half: it writes the plants'
# production history into Postgres and generates the semantic model for it.
# DI reads that history through the model, and the copilot runs the
# consulting loop over it: goal → investigation → finding → plan → adoption →
# acceptance. SmartFactory's MCP server is configured below as an external
# server: read-only tools the copilot may call while investigating, and
# actions that only run when a person adopts a plan.
#
# Run (from the repository root):
#   set -a; . examples/smartfactory/env.example; set +a   # then fill in real values
#   go build -o /tmp/di ./cmd/di
#   /tmp/di serve -config examples/smartfactory/config.yaml
#   open http://localhost:41900/
#
# Relative paths (model, brief_file, consult.store) resolve beside this file.

engagement: huaduan

# Generated by SmartFactory for this customer's history tables.
model: huaduan.model.yaml

warehouse:
  dsn: "${DI_DSN}"            # postgres://user:pass@host:5432/db?sslmode=disable
  timeout_secs: 30
  max_rows: 10000

# Two named people are the minimum for the loop: one proposes (directly or by
# asking the copilot), a different one adopts. Each signs in to the console by
# pasting their token; API callers send it as a Bearer token.
auth:
  users:
    - {name: consultant,    role: analyst,  token_env: DI_TOKEN_CONSULTANT}
    - {name: plant_manager, role: approver, token_env: DI_TOKEN_APPROVER}

copilot:
  # Who the tools act as when a caller is anonymous. Identified callers act as
  # themselves, and are recorded as the proposer of what the copilot proposes.
  principal: {user: copilot, role: analyst}
  brief_file: brief.md
  mcp:
    - name: sf
      url: "${SF_MCP_URL}"
      token_env: SF_MCP_TOKEN
      # Read-only: the copilot may call these as sf__<tool>.
      tools: [list_sites, plant_status, list_alarms, get_asset, read_tags, list_sources, simulate_plan]
      # Changes the plant: never callable by the copilot, only as an adopted
      # plan's action.
      actions: [send_command]

consult:
  store: consult.db
  # Set this to the model's production-date dimension if a metric reaches
  # more than one time dimension.
  time_dimension: ""
  # Every baseline and acceptance is measured as this identity, so row
  # filters cannot make the two measure different rows.
  measure_as: {user: consult, role: analyst}
  # Only these roles may adopt or reject.
  adopt_roles: [approver]
  check_every: 1h
  # true lets adoption/acceptance be anchored on a past day to replay history
  # (recorded on every decision that uses it). Keep false in production.
  allow_as_of: false

# The name in the console's top bar (served at /).
ui:
  title: 华锻经营顾问

server:
  rest_addr: ":41900"
  mcp_addr: ":41910"
