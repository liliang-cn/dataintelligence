- name: shrinkage_rate
  description: Loss as a share of revenue. Two fact tables at their own grains — a
    join between them multiplies both sides.
  synonyms:
  - shrinkage rate
  - shrink
  - loss rate
  formula: shrinkage_loss_amount_sum / nullif(sale_revenue_sum, 0)
  additivity: non_additive
  roles: []
- name: sales_per_sqm
  description: Revenue per square metre of selling floor. The area lives in stores,
    one row per shop; joining it to sales counts each shop's area once per sales row.
  synonyms:
  - sales per sqm
  - sales density
  formula: sale_revenue_sum / nullif(store_area_sqm_sum, 0)
  additivity: non_additive
  roles: []
